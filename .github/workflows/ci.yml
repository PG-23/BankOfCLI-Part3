# CI: build the test the backend and the REACT frontend on every push and PR.
name: CI

on:
  push:
    branches: [develop,main]
  pull_request:
    branches: [develop,main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-api
    
    # @SpringBootTest tests need a real Postgres; credentials match application.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankofcli
          POSTGRES_USER: bankofcli
          POSTGRES_PASSWORD: bankofcli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankofcli -d bankofcli"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
     - uses: actions/checkout@v4
     - name: Set up Java 17
       uses: actions/setup-java@v4
       with:
        distribution: temurin
        java-version: '17'
        cache: maven
    
     - name: Build and run tests
       run: |
        chmod +x mvnw
        ./mvnw -B clean verify
  

  frontend:
    name: frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: React-Frontend
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm 
          cache-dependency-path: React-Frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
    
    