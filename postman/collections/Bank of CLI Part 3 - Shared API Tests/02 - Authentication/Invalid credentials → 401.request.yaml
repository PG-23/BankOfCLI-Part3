$kind: http-request
description: Expected by contract once auth is implemented.
url: "{{baseUrl}}{{apiPrefix}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "not-a-user@example.com",
      "password": "incorrect-password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 401", function () { pm.response.to.have.status(401); });
      pm.test("Contract error code", function () {
        pm.expect(pm.response.json().code).to.eql("INVALID_CREDENTIALS");
      });
    language: text/javascript
order: 2000
