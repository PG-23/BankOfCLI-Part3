$kind: http-request
description: Needs signed JWT; runs after successful login. Uses inherited Bearer auth.
url: "{{baseUrl}}{{apiPrefix}}/accounts/me"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
