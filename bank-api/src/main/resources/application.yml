app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-before-deploying-0000}
    expiration-minutes: 60
  cors:
    # Comma-separated. On AWS, ECS sets CORS_ALLOWED_ORIGINS to the CloudFront URL(s).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
spring:
  jackson:
    deserialization:
      accept-float-as-int: false   # reject 10.5 for whole-number fields (money is integer cents) instead of truncating
  datasource:
    # Defaults match the local Docker Postgres; on AWS, ECS sets these env vars (RDS host + Secrets Manager login).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankofcli}
    username: ${DB_USERNAME:bankofcli}
    password: ${DB_PASSWORD:bankofcli}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The dev-only seed (db/seed) is missing when running without the dev profile; don't fail on it.
    ignore-migration-patterns: "*:future,*:missing"
server:
  port: 8080
  servlet:
    context-path: /api