app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-before-deploying-0000}
    expiration-minutes: 60
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankofcli
    username: bankofcli
    password: bankofcli
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  servlet:
    context-path: /api