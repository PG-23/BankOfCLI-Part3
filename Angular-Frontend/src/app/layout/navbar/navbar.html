<header class="navbar">
  <button
    class="navbar__menu"
    type="button"
    (click)="menuToggled.emit()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="menuOpen() ? 'app-sidebar' : null"
    aria-label="Open menu"
  >
    <span></span><span></span><span></span>
  </button>

  <div class="navbar__brand">
    <span class="navbar__mark" aria-hidden="true">AA</span>
    <span class="navbar__title">{{ title() }}</span>
  </div>

  @if (userName()) {
    <div class="navbar__user">
      <button
        type="button"
        class="navbar__user-btn"
        aria-haspopup="true"
        [attr.aria-expanded]="userMenuOpen()"
        (click)="toggleUserMenu()"
      >
        <span class="navbar__avatar" aria-hidden="true">{{ initial() }}</span>
        <span class="navbar__user-text">
          <strong>{{ userName() }}</strong>
          <small>{{ userId() }}</small>
        </span>
        <span class="navbar__caret" aria-hidden="true"></span>
      </button>

      @if (userMenuOpen()) {
        <div class="navbar__dropdown">
          <div class="navbar__dropdown-info">
            <strong>{{ userName() }}</strong>
            <span>{{ userEmail() }}</span>
            <span>{{ userId() }}</span>
          </div>
          <button type="button" class="navbar__logout" (click)="logout()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 9v3a3 3 0 0 0 3 3h13" />
              <path d="M16 11l4 4-4 4" />
            </svg>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  }
</header>
